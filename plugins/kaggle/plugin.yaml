# Kaggle plugin manifest. Read before any plugin code is imported.
name: kaggle
title: Kaggle
version: 0.1.0
author: tedo001 <durgamani.d.e.c.e.50@gmail.com>
description: "Search and download Kaggle datasets with your Kaggle API token."
license:
  category: open-source
  name: Apache-2.0 (Kaggle API client)
  spdx: Apache-2.0
  url: https://github.com/Kaggle/kaggle-api/blob/main/LICENSE.txt
  notes: Each Kaggle dataset has its own licence, shown on its Kaggle page and checked before download.
capabilities: [dataset_source]
entry: plugins.kaggle.plugin:KagglePlugin
requires: ["kaggle>=1.6"]
credentials:
  - {key: KAGGLE_USERNAME, label: Kaggle username, secret: false}
  - {key: KAGGLE_KEY, label: Kaggle API key}
maturity: planned
planned_for: v0.1 · build phase 9
homepage: https://www.kaggle.com/docs/api
