# Kaggle plugin manifest. Read before any plugin code is imported.
name: kaggle
title: Kaggle
version: 0.1.0
author: tedo001 <durgamani.d.e.c.e.50@gmail.com>
description: "Search and download Kaggle datasets with your Kaggle username and API key."
license:
  category: unspecified
  name: This project's code (Kaggle's public REST API; Kaggle's terms of use apply)
  url: https://www.kaggle.com/terms
  notes: No Kaggle client library is used. Each dataset has its own licence, shown before download
    and saved in source.json next to the files. Competitions, which need their rules accepted on
    Kaggle, are not downloaded.
capabilities: [dataset_source]
entry: plugins.kaggle.plugin:KagglePlugin
requires: []
credentials:
  - {key: KAGGLE_USERNAME, label: Kaggle username, secret: false}
  - {key: KAGGLE_KEY, label: Kaggle API key}
origin: builtin
maturity: stable
homepage: https://www.kaggle.com/docs/api
