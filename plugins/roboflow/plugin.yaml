# Roboflow plugin manifest. Read before any plugin code is imported.
name: roboflow
title: Roboflow
version: 0.1.0
author: tedo001 <durgamani.d.e.c.e.50@gmail.com>
description: "Export dataset versions from your Roboflow workspace into the lab (COCO format)."
license:
  category: unspecified
  name: This project's code (Roboflow's REST API; Roboflow's terms of service apply)
  url: https://roboflow.com/terms
  notes: No Roboflow client library is used. Each project's licence is shown before download
    ("unspecified" when Roboflow reports none) and saved in source.json next to the files.
capabilities: [dataset_source]
entry: plugins.roboflow.plugin:RoboflowPlugin
requires: []
credentials:
  - {key: ROBOFLOW_API_KEY, label: Roboflow API key}
origin: builtin
maturity: stable
homepage: https://docs.roboflow.com/api-reference
