name: Windows installer

# Builds dist\installer\TEDO-AI-Lab-<version>-win64.msi on Windows with cx_Freeze (it builds for
# the system it runs on; every build tool is MIT/Apache/PSF), checks the built app opens every
# page, installs the .msi silently and checks the installed copy too. On a v* tag the installer
# is attached to the GitHub release of that tag.
on:
  workflow_dispatch:
  push:
    # Branch pushes build only when packaging changes; tags always build (GitHub does not apply
    # path filters to tags).
    branches: [tedo]
    tags: ["v*"]
    paths: ["packaging/**", ".github/workflows/installer.yml", "core/common/paths.py",
            "core/common/experiment_env.py", "app/smoke.py"]

concurrency:
  group: installer-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write  # attach the setup file to a release (tags only)

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            packaging/requirements-window.txt
            packaging/requirements-build.txt

      - name: The window's libraries and cx_Freeze
        run: pip install -r packaging\requirements-window.txt -r packaging\requirements-build.txt

      - name: Build TEDO-AI-Lab.exe
        run: python packaging\freeze.py build_exe

      - name: The built app opens every page
        shell: pwsh
        run: |
          $env:TEDO_SMOKE_REPORT = "$env:RUNNER_TEMP\smoke-report.txt"
          $env:TEMP = $env:TMP = "$env:RUNNER_TEMP\smoke"
          New-Item -ItemType Directory -Force $env:TEMP | Out-Null
          $p = Start-Process dist\TEDO-AI-Lab\TEDO-AI-Lab.exe -ArgumentList "--smoke-test" -Wait -PassThru
          if (Test-Path $env:TEDO_SMOKE_REPORT) { Get-Content $env:TEDO_SMOKE_REPORT }
          if ($p.ExitCode -ne 0) {
            Get-ChildItem "$env:TEMP\tedo-smoke-*\logs\app.log" -ErrorAction SilentlyContinue |
              ForEach-Object { "--- $_"; Get-Content $_ -Tail 120 }
            throw "smoke test failed with exit code $($p.ExitCode)"
          }
          "{0:N0} MB" -f ((Get-ChildItem dist\TEDO-AI-Lab -Recurse | Measure-Object Length -Sum).Sum / 1MB)

      - name: The installer (.msi)
        shell: pwsh
        run: |
          python packaging\freeze.py bdist_msi --skip-build
          if ($LASTEXITCODE -ne 0) { throw "bdist_msi failed" }
          Get-ChildItem dist\installer

      - name: Install silently and check the installed app
        shell: pwsh
        run: |
          $msi = (Get-ChildItem dist\installer\*.msi)[0].FullName
          $target = "$env:RUNNER_TEMP\tedo-lab-installed"
          $log = "$env:RUNNER_TEMP\msi.log"
          $p = Start-Process msiexec.exe -ArgumentList "/i", "`"$msi`"", "/qn", "/norestart", "MSIINSTALLPERUSER=1", "TARGETDIR=`"$target`"", "/l*v", "`"$log`"" -Wait -PassThru
          if ($p.ExitCode -ne 0) { Get-Content $log -Tail 60; throw "msiexec failed with exit code $($p.ExitCode)" }
          $env:TEDO_SMOKE_REPORT = "$env:RUNNER_TEMP\installed-smoke.txt"
          $p = Start-Process "$target\TEDO-AI-Lab.exe" -ArgumentList "--smoke-test" -Wait -PassThru
          if (Test-Path $env:TEDO_SMOKE_REPORT) { Get-Content $env:TEDO_SMOKE_REPORT }
          if ($p.ExitCode -ne 0) { throw "the installed app failed its smoke test ($($p.ExitCode))" }
          if (-not (Test-Path "$target\licences\THIRD-PARTY-NOTICES.md")) { throw "licence notices missing" }
          if (-not (Test-Path "$target\lab-code\core\common\paths.py")) { throw "lab-code missing" }
          "Installed and checked: $target"
          $p = Start-Process msiexec.exe -ArgumentList "/x", "`"$msi`"", "/qn", "/norestart" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "uninstall failed with exit code $($p.ExitCode)" }
          if (Test-Path "$target\TEDO-AI-Lab.exe") { throw "uninstall left the app behind" }
          "Uninstalled cleanly"

      - uses: actions/upload-artifact@v4
        with:
          name: TEDO-AI-Lab-setup
          path: dist/installer/*.msi
          retention-days: 30

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          gh release view $tag 2>$null; if ($LASTEXITCODE -ne 0) { gh release create $tag --title "TEDO AI Research Lab $tag" --notes "Windows installer: download TEDO-AI-Lab-*-win64.msi below." }
          gh release upload $tag (Get-ChildItem dist\installer\*.msi).FullName --clobber
