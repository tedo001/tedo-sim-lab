# Experiment runners the worker can use, as "module:Class". core/ never imports
# labs/ directly; it loads these at run time.
runners:
  - labs.computer_vision.classification:TorchClassificationRunner
  - labs.classical_ml.runner:SklearnRunner
  - labs.computer_vision.experimental:ObjectDetectionRunner
  - labs.computer_vision.experimental:SegmentationRunner
  - labs.computer_vision.experimental:OcrRunner
  - labs.computer_vision.experimental:PoseRunner
  - labs.computer_vision.experimental:TrackingRunner

# Benchmarks the worker may run (``worker <folder> --benchmark``), as "module:function".
benchmarks:
  - labs.benchmark.latency:run_benchmark
