# Synthetic two-dimensional sets, generated by the lab with a fixed seed (no download). They are
# small and hard for a linear model, which makes them the standard first test of a quantum or
# kernel classifier; they work in the Classical ML lab and the 3-D explorer as well.
_generated: &generated
  category: open-source
  name: Generated by the lab (scikit-learn generators, BSD-3-Clause)
  spdx: BSD-3-Clause
  url: https://github.com/scikit-learn/scikit-learn/blob/main/COPYING
  notes: Made on your computer from a fixed seed; nothing is downloaded.

cards:
  - id: two_moons
    name: Two moons
    description: Two interleaving half circles with noise; 400 points, two classes.
    tasks: [quantum_classification, tabular_classification]
    modality: tabular
    source_url: https://scikit-learn.org/stable/modules/generated/sklearn.datasets.make_moons.html
    license: *generated
    size: 400 rows × 2 features
    num_classes: 2
    class_names: [upper moon, lower moon]
    splits: {all: 400}
    auto_download_allowed: true
    adapter: labs.quantum_ml.data:SyntheticAdapter
    options: {generator: moons}
    maturity: stable
    citation: Generated with scikit-learn's make_moons (noise 0.15, seed 0).
    tags: [synthetic, builtin, quantum, beginner]

  - id: circles
    name: Circles
    description: A small circle inside a larger one; 400 points, two classes.
    tasks: [quantum_classification, tabular_classification]
    modality: tabular
    source_url: https://scikit-learn.org/stable/modules/generated/sklearn.datasets.make_circles.html
    license: *generated
    size: 400 rows × 2 features
    num_classes: 2
    class_names: [outer, inner]
    splits: {all: 400}
    auto_download_allowed: true
    adapter: labs.quantum_ml.data:SyntheticAdapter
    options: {generator: circles}
    maturity: stable
    citation: Generated with scikit-learn's make_circles (noise 0.08, factor 0.5, seed 0).
    tags: [synthetic, builtin, quantum]

  - id: xor
    name: XOR
    description: Points in a square; the class is whether x and y have the same sign. 400 points.
    tasks: [quantum_classification, tabular_classification]
    modality: tabular
    source_url: https://en.wikipedia.org/wiki/Exclusive_or
    license: *generated
    size: 400 rows × 2 features
    num_classes: 2
    class_names: [same sign, opposite sign]
    splits: {all: 400}
    auto_download_allowed: true
    adapter: labs.quantum_ml.data:SyntheticAdapter
    options: {generator: xor}
    maturity: stable
    citation: Generated by the lab (uniform points, seed 0).
    tags: [synthetic, builtin, quantum]
