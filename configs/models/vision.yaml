# Image-classification models built into the lab (trainable since build phase 4) and
# external vision models listed for later releases.
# Owner policy: third-party models must be permissively licensed (MIT, Apache-2.0, BSD);
# copyleft ones such as Ultralytics YOLO (AGPL-3.0) are not allowed.
cards:
  - id: simple_cnn
    name: SimpleCNN
    description: A small convolutional network for quick experiments on small images.
    architecture: 2 × (Conv → BatchNorm → ReLU → MaxPool) → Linear
    framework: pytorch
    tasks: [image_classification, audio_classification]
    source_url: https://github.com/tedo001/tedo-sim-lab
    license: &this_project
      category: unspecified
      name: This project's licence (none chosen yet)
      notes: Written for this lab; covered by the repository's licence once one is chosen.
    input_spec: C×H×W, H and W at least 8
    origin: builtin
    builder: labs.computer_vision.models:build_simple_cnn
    maturity: stable
    tags: [cnn, small, cpu]

  - id: lenet5
    name: LeNet-5
    description: The classic convolutional network for digit recognition, in its common modern
      form (ReLU and max-pooling). Inputs are resized to 32×32 unless the experiment says otherwise.
    architecture: LeNet-5 (LeCun et al., 1998)
    framework: pytorch
    tasks: [image_classification, audio_classification]
    source_url: http://yann.lecun.com/exdb/lenet/
    license: *this_project
    input_spec: C×H×W, resized to 32×32
    origin: builtin
    builder: labs.computer_vision.models:build_lenet5
    maturity: stable
    tags: [cnn, small, cpu, classic]

  - id: resnet18
    name: ResNet-18
    description: 18-layer residual network from torchvision, optionally ImageNet-pretrained.
    architecture: ResNet-18 (He et al., 2016)
    framework: pytorch
    tasks: [image_classification, audio_classification]
    source_url: https://pytorch.org/vision/stable/models/resnet.html
    license:
      category: open-source
      name: BSD-3-Clause (torchvision code)
      spdx: BSD-3-Clause
      url: https://github.com/pytorch/vision/blob/main/LICENSE
    params: 11689512
    input_spec: 3×H×W (224×224 for the ImageNet weights); other inputs are adapted
    weights:
      - id: imagenet1k_v1
        description: torchvision's ImageNet-1k weights (ResNet18_Weights.IMAGENET1K_V1).
        license:
          category: research-only
          name: ImageNet Terms of Access (training data)
          url: https://image-net.org/download.php
          notes: Trained on ImageNet. torchvision warns that pretrained weights may carry terms
            from their training data; treat them as non-commercial research use.
        size_mb: 44.7
        auto_download_allowed: true
    builder: labs.computer_vision.models:build_resnet18
    maturity: stable
    tags: [cnn, residual, pretrained]

  - id: tiny_vgg
    name: TinyVGG
    description: The small VGG-style network from CNN Explainer. The lab's CNN Explainer shows
      what it computes, layer by layer.
    architecture: 2 × (Conv 3×3 → ReLU → Conv 3×3 → ReLU → MaxPool 2×2) → Flatten → Linear
      (Wang et al., CNN Explainer, 2020)
    framework: pytorch
    tasks: [image_classification, audio_classification]
    source_url: https://github.com/poloclub/cnn-explainer
    license:
      category: open-source
      name: MIT (CNN Explainer)
      spdx: MIT
      url: https://github.com/poloclub/cnn-explainer/blob/master/LICENSE
      notes: Architecture and explainer ported from CNN Explainer (Polo Club of Data Science,
        Georgia Tech). Its pretrained weights and example images come from Tiny ImageNet
        (derived from ImageNet) and are not used.
    input_spec: C×H×W, square, at least 16×16
    origin: builtin
    builder: labs.computer_vision.models:build_tiny_vgg
    maturity: stable
    tags: [cnn, small, cpu, explainer]

  - id: layer_stack
    name: Layer stack (Deep Learning builder)
    description: A network you design layer by layer on the Deep Learning page (convolution,
      batch norm, ReLU, pooling, dropout, linear); the last Linear layer to the classes is added
      for you. Without a design it trains the starter stack.
    architecture: Your layers, then Flatten (if needed) → Linear(classes)
    framework: pytorch
    tasks: [image_classification, audio_classification]
    source_url: https://github.com/tedo001/tedo-sim-lab
    license: *this_project
    input_spec: C×H×W; the stack's shapes are checked against it before training
    origin: builtin
    builder: labs.deep_learning.model:build_layer_stack
    maturity: stable
    tags: [cnn, custom, builder, cpu]

  - id: rt_detr
    name: RT-DETR (R18)
    description: Real-time detection transformer from Baidu with a ResNet-18 backbone; finds the 80 COCO
      object classes. Runs on the Model Testing page (detection test).
    architecture: RT-DETR (Zhao et al., 2024), ResNet-18-vd backbone, hybrid encoder
    framework: huggingface
    tasks: [object_detection]
    source_url: https://github.com/lyuwenyu/RT-DETR
    license:
      category: open-source
      name: Apache-2.0
      spdx: Apache-2.0
      url: https://github.com/lyuwenyu/RT-DETR/blob/main/LICENSE
    params: 20184464
    input_spec: Images (resized to 640×640)
    weights:
      - id: coco
        description: PekingU/rtdetr_r18vd, trained on COCO 2017.
        license:
          category: open-source
          name: Apache-2.0
          spdx: Apache-2.0
          url: https://huggingface.co/PekingU/rtdetr_r18vd
          notes: Trained on COCO 2017, whose images keep their own Flickr licences.
        size_mb: 81
        auto_download_allowed: true
        hub_repo: PekingU/rtdetr_r18vd
    maturity: stable
    tags: [detection, transformer, pretrained]

  - id: yolos_tiny
    name: YOLOS tiny
    description: A plain Vision Transformer that detects objects (Fang et al., 2021); tiny and quick on a
      CPU. Apache-2.0, unlike Ultralytics YOLO (AGPL-3.0, kept out).
    architecture: ViT-Tiny with detection tokens
    framework: huggingface
    tasks: [object_detection]
    source_url: https://huggingface.co/hustvl/yolos-tiny
    license:
      category: open-source
      name: Apache-2.0
      spdx: Apache-2.0
      url: https://github.com/hustvl/YOLOS/blob/main/LICENSE
    params: 6488736
    input_spec: Images (shorter side 512)
    weights:
      - id: coco
        description: hustvl/yolos-tiny, trained on COCO 2017.
        license:
          category: open-source
          name: Apache-2.0
          spdx: Apache-2.0
          url: https://huggingface.co/hustvl/yolos-tiny
          notes: Trained on COCO 2017, whose images keep their own Flickr licences.
        size_mb: 26
        auto_download_allowed: true
        hub_repo: hustvl/yolos-tiny
    maturity: stable
    tags: [detection, transformer, small, cpu]

  - id: sam
    name: Segment Anything (SAM)
    description: Meta's promptable segmentation model.
    architecture: SAM (Kirillov et al., 2023)
    framework: pytorch
    tasks: [instance_segmentation]
    source_url: https://github.com/facebookresearch/segment-anything
    license:
      category: open-source
      name: Apache-2.0
      spdx: Apache-2.0
      url: https://github.com/facebookresearch/segment-anything/blob/main/LICENSE
    maturity: planned
    planned_for: v0.5
    tags: [segmentation, foundation-model]

  - id: paddleocr
    name: PaddleOCR
    description: Text detection and recognition toolkit from PaddlePaddle.
    architecture: PP-OCR pipeline
    framework: paddle
    tasks: [ocr]
    source_url: https://github.com/PaddlePaddle/PaddleOCR
    license:
      category: open-source
      name: Apache-2.0
      spdx: Apache-2.0
      url: https://github.com/PaddlePaddle/PaddleOCR/blob/main/LICENSE
    requires: ["paddleocr>=2.7", "paddlepaddle>=2.6"]
    maturity: planned
    planned_for: v0.5
    tags: [ocr, text]

  - id: easyocr
    name: EasyOCR
    description: Ready-to-use OCR for 80+ languages, text detection followed by recognition.
    architecture: CRAFT text detector + CRNN recogniser (BiLSTM, CTC)
    framework: pytorch
    tasks: [ocr]
    source_url: https://github.com/JaidedAI/EasyOCR
    license:
      category: open-source
      name: Apache-2.0
      spdx: Apache-2.0
      url: https://github.com/JaidedAI/EasyOCR/blob/master/LICENSE
      notes: No separate licence is published for the weights it downloads; its detector comes from
        clovaai/CRAFT-pytorch (MIT).
    requires: ["easyocr>=1.7"]
    maturity: planned
    planned_for: v0.5
    tags: [ocr, text, multilingual]

  - id: trocr_base_printed
    name: TrOCR base (printed)
    description: Transformer OCR for single printed text lines (microsoft/trocr-base-printed).
    architecture: Image Transformer encoder (BEiT) + text Transformer decoder (RoBERTa)
    framework: huggingface
    tasks: [ocr]
    source_url: https://huggingface.co/microsoft/trocr-base-printed
    license:
      category: open-source
      name: MIT
      spdx: MIT
      url: https://github.com/microsoft/unilm/blob/master/LICENSE
      notes: The model page has no licence field; the MIT licence comes from the microsoft/unilm repository
        that publishes TrOCR.
    requires: ["transformers>=4.42"]
    maturity: planned
    planned_for: v0.5
    tags: [ocr, transformer]

  - id: detr_resnet50
    name: DETR (ResNet-50)
    description: End-to-end Transformer object detector trained on COCO 2017 (facebook/detr-resnet-50).
    architecture: ResNet-50 + Transformer encoder-decoder, 100 object queries
    framework: huggingface
    tasks: [object_detection]
    source_url: https://huggingface.co/facebook/detr-resnet-50
    license:
      category: open-source
      name: Apache-2.0
      spdx: Apache-2.0
      url: https://github.com/facebookresearch/detr/blob/main/LICENSE
      notes: DETR and its weights are released under Apache-2.0. Trained on COCO, whose images keep their
        own Flickr licences.
    requires: ["transformers>=4.42", "timm>=0.9"]
    maturity: planned
    planned_for: v0.5
    tags: [detection, transformer, coco]

  - id: yolox
    name: YOLOX
    description: Anchor-free YOLO-family detector (nano to x) from Megvii; a permissive alternative to
      Ultralytics YOLO.
    architecture: Anchor-free YOLO, CSPDarknet backbone, decoupled head, SimOTA
    framework: pytorch
    tasks: [object_detection]
    source_url: https://github.com/Megvii-BaseDetection/YOLOX
    license:
      category: open-source
      name: Apache-2.0
      spdx: Apache-2.0
      url: https://github.com/Megvii-BaseDetection/YOLOX/blob/main/LICENSE
    maturity: planned
    planned_for: v0.5
    tags: [detection, yolo, real-time]

