# Tools and models the lab deliberately does not use, and why (owner policy: permissive
# licences only, MIT or Apache-2.0, with BSD/ISC/PSF as equivalents; never copyleft).
# Shown in the Model Zoo so nobody adds them back by accident.
excluded:
  - name: Ultralytics YOLO (YOLOv5, YOLOv8, YOLO11)
    licence: AGPL-3.0
    url: https://github.com/ultralytics/ultralytics/blob/main/LICENSE
    reason: Copyleft (AGPL-3.0); RT-DETR from Hugging Face Transformers (Apache-2.0) is listed for
      object detection instead.
  - name: PyQt6
    licence: GPL-3.0
    url: https://www.riverbankcomputing.com/software/pyqt/
    reason: Copyleft (GPL-3.0); the app uses PySide6 (LGPL-3.0, the documented exception) as a
      separate, replaceable library.
  - name: PyInstaller
    licence: GPL-2.0-or-later (bootloader exception)
    url: https://pyinstaller.org/en/stable/license.html
    reason: Copyleft, even though its bootloader exception allows shipping it; the Windows app is
      built with cx_Freeze (PSF-2.0) and its launcher freeze-core (MIT) instead.
  - name: Inno Setup
    licence: Inno Setup License (its own terms)
    url: https://jrsoftware.org/files/is/license.txt
    reason: Neither MIT nor Apache-2.0; the installer is a Windows Installer package (.msi) written
      by cx_Freeze with python-msilib (PSF-2.0).
